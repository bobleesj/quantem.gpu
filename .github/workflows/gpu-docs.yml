# Build the quantem.gpu Jupyter Book and publish it to GitHub Pages. The build
# is hardware-independent: physical CUDA, Metal/MPS, and WebGPU runs contribute
# retained evidence files, not live benchmark jobs on the Pages runner.
name: GPU docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "scripts/check_docs_links.py"
      - "scripts/check_docs_nav_toggle.py"
      - "scripts/check_profile_registry.py"
      - "scripts/benchmark_registry.py"
      - "benchmarks/**"
      - "experiments/**"
      - "tests/test_docs_site.py"
      - "tests/test_profile_registry.py"
      - "tests/test_benchmark_registry.py"
      - ".github/workflows/gpu-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gpu-docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/configure-pages@v6
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]" pytest
      - name: Build and verify documentation
        run: |
          python scripts/check_profile_registry.py
          python scripts/check_docs_links.py
          python -m pytest -q tests/test_docs_site.py tests/test_backend_load_checklist.py tests/test_profile_registry.py tests/test_benchmark_registry.py
          jupyter-book build docs
          python scripts/check_docs_links.py --html-root docs/_build/html
          python scripts/check_docs_nav_toggle.py docs/_build/html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
