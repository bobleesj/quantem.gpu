name: GPU release

on:
  push:
    tags:
      - "gpu-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: gpu-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build quantem.gpu
    runs-on: ubuntu-latest
    environment: testpypi
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade build hatchling twine

      - name: Resolve GPU package version from tag
        id: version
        run: |
          python - <<'PY'
          import os
          import re

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"gpu-v(?P<version>\d+\.\d+\.\d+(?:rc\d+|\.post\d+)?)", tag)
          if match is None:
              raise SystemExit(
                  f"Expected tag gpu-vX.Y.Z, gpu-vX.Y.ZrcN, or gpu-vX.Y.Z.postN; got {tag!r}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={match.group('version')}", file=output)
          PY

      - name: Stamp GPU package version
        env:
          GPU_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          version = os.environ["GPU_VERSION"]
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Expected exactly one project.version field")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Build GPU distributions
        run: python -m build . --wheel --no-isolation --outdir dist/gpu

      - name: Check GPU distributions
        run: python -m twine check dist/gpu/*

      - name: Check GPU wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = sorted(Path("dist/gpu").glob("quantem_gpu-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          wheel = wheels[0]
          required = {
              "quantem/gpu/__init__.py",
              "quantem/gpu/device/select.py",
              "quantem/gpu/io/load.py",
              "quantem/gpu/io/hdf5/cuda/decode.py",
              "quantem/gpu/io/hdf5/mps/decode.py",
              "quantem/gpu/resident/mps/counts.py",
              "quantem/gpu/io/hdf5/mps/kernels/bslz4.msl",
              "quantem/gpu/io/hdf5/webgpu/bslz4.ts",
              "quantem/gpu/display/__init__.py",
              "quantem/gpu/io/hdf5/mps/kernels/qh5idx.metal",
              "quantem/gpu/resident/mps/kernels/runtime_spatial.msl",
              "quantem/gpu/display/colormaps.json",
              "quantem/gpu/display/metal/display.metal",
              "quantem/gpu/detector/workflow.py",
              "quantem/gpu/detector/cuda/kernels/virtual_image.cu",
              "quantem/gpu/detector/cuda/dense.py",
              "quantem/gpu/resident/mps/virtual_image.py",
              "quantem/gpu/detector/webgpu/backend.ts",
              "quantem/gpu/detector/webgpu/qem-source.ts",
              "quantem/gpu/formats/qem/qem-rans-tables-v1.json",
              "quantem/gpu/webgpu/sources.json",
              "quantem/gpu/dpc/workflow.py",
              "quantem/gpu/dpc/webgpu/kernels.ts",
              "quantem/gpu/movie/mps.py",
              "quantem/gpu/ssb/workflow.py",
              "quantem/gpu/ssb/results.py",
              "quantem/gpu/ssb/contract.py",
              "quantem/gpu/ssb/cuda/backend.py",
              "quantem/gpu/ssb/mps/backend.py",
              "quantem/gpu/ssb/webgpu/backend.ts",
          }
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"{wheel} missing required files: {missing}")
          native_sources = sorted(
              name
              for name in names
              if name.endswith((".swift", ".c", ".h", ".cpp", ".hpp", ".comp"))
          )
          if native_sources:
              raise SystemExit(
                  f"{wheel} contains native-only files: {native_sources}"
              )
          license_files = {
              name.rsplit("/", 1)[-1]
              for name in names
              if ".dist-info/licenses/" in name
          }
          required_license_files = {"LICENSE", "THIRD_PARTY_NOTICES.md"}
          missing_license = sorted(required_license_files - license_files)
          if missing_license:
              raise SystemExit(
                  f"{wheel} missing license files in dist-info/licenses: {missing_license}"
              )
          print(f"wheel ok: {wheel}")
          PY

      - name: Keep the exact candidate wheel
        uses: actions/upload-artifact@v4
        with:
          name: candidate-wheel
          path: dist/gpu/*.whl
          if-no-files-found: error

  hardware:
    name: SSB acceptance (${{ matrix.backend }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, mps]
    runs-on: [self-hosted, "quantem-${{ matrix.backend }}"]
    timeout-minutes: 45
    env:
      PYTHONPATH: ""
      PYTORCH_ENABLE_MPS_FALLBACK: "0"
      PYTORCH_MPS_FAST_MATH: "0"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      QUANTEM_SSB_REFERENCE_PHASE: ${{ matrix.backend == 'cuda' && vars.SSB_CUDA_REFERENCE_PHASE || vars.SSB_MPS_REFERENCE_PHASE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: candidate-wheel
          path: candidate
      - name: Fresh wheel installation
        shell: bash
        run: |
          set -euo pipefail
          CHECK_ENV="$RUNNER_TEMP/ssb-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.backend }}"
          python3 -m venv "$CHECK_ENV"
          echo "$CHECK_ENV/bin" >> "$GITHUB_PATH"
          WHEEL=$(find "$PWD/candidate" -name '*.whl')
          "$CHECK_ENV/bin/python" -m pip install "$WHEEL[${{ matrix.backend }}]" \
            --extra-index-url https://test.pypi.org/simple/ \
            huggingface_hub pytest playwright jupyterlab nbclient
      - name: Fetch the public benchmark acquisition
        shell: bash
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download
          root = snapshot_download("bobleesj/quantem-data", repo_type="dataset",
              revision="5925e4b49b2ca28ff82d6d5a6b9a8bfea9edfb20",
              allow_patterns="4dstem/gold_512/*")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              print("QUANTEM_SSB_RELEASE_SOURCE=" + str(Path(root) / "4dstem/gold_512/gold_004_master.h5"), file=output)
          PYCODE
      - name: Full-data joint fitting and repeated reconstruction
        shell: bash
        run: |
          test -f "${QUANTEM_SSB_REFERENCE_PHASE:?Configure the approved public-gold Auto phase reference for this runner}"
          quantem-gpu benchmark-ssb "$QUANTEM_SSB_RELEASE_SOURCE" \
            --require-installed --backend "${{ matrix.backend }}" \
            --semiangle-mrad 30 --scan-sampling-a 0.5 --detector-sampling-mrad 0.46 \
            --reference-phase "$QUANTEM_SSB_REFERENCE_PHASE" \
            --out "$RUNNER_TEMP/ssb-${{ matrix.backend }}.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ssb-${{ matrix.backend }}
          path: ${{ runner.temp }}/ssb-${{ matrix.backend }}.json
          if-no-files-found: error

  testpypi:
    name: Publish qualified quantem.gpu
    needs: [build, hardware]
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-wheel
          path: dist/gpu
      - name: Publish GPU to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/gpu/
