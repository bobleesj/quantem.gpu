name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,movie]"
      - name: Validate profiling registry
        run: python scripts/check_profile_registry.py
      - name: Run Python tests
        run: PYTHONPATH=src pytest -q

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt pytest
      - name: Build and verify documentation
        run: |
          python scripts/check_profile_registry.py
          python scripts/check_docs_links.py
          python -m pytest -q tests/test_docs_site.py tests/test_backend_load_checklist.py tests/test_profile_registry.py tests/test_benchmark_registry.py
          jupyter-book build docs
          python scripts/check_docs_links.py --html-root docs/_build/html
          python scripts/check_docs_nav_toggle.py docs/_build/html

  metal:
    name: Metal package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Check Swift formatting
        run: >-
          xcrun swift-format lint --strict --recursive
          Package.swift
          src/quantem/gpu/swift/Sources
          src/quantem/gpu/swift/Tests
          src/quantem/gpu/swift/Benchmarks
      - name: Run Swift tests
        run: swift test
      - name: Compile Metal for iOS
        run: |
          xcrun -sdk iphoneos metal -c src/quantem/gpu/swift/Sources/Metal4DSTEMKernels/Resources/detector.metal -o /tmp/quantem-detector.air
          xcrun -sdk iphoneos metal -c src/quantem/gpu/swift/Sources/Metal4DSTEMKernels/Resources/qh5idx.metal -o /tmp/quantem-qh5idx.air
          xcrun -sdk iphoneos metal -c src/quantem/gpu/swift/Sources/MetalDisplayKernels/Resources/display.metal -o /tmp/quantem-display.air
      - name: Build Swift libraries for iOS
        run: |
          xcodebuild -scheme Metal4DSTEMKernels -destination generic/platform=iOS -configuration Release CODE_SIGNING_ALLOWED=NO build
          xcodebuild -scheme MetalDisplayKernels -destination generic/platform=iOS -configuration Release CODE_SIGNING_ALLOWED=NO build
