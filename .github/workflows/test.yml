name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qem-portable:
    name: QEM reference and integrity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU tensor runtime
        if: runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_qem_validation.py tests/test_qem_metadata.py tests/test_qem_reference.py

  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,movie,plot]" ipython
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser contract tools
        run: npm ci
      - name: Build pinned widget for display contract tests
        run: |
          git clone --no-checkout https://github.com/bobleesj/quantem.widget.git "$RUNNER_TEMP/widget-contract"
          git -C "$RUNNER_TEMP/widget-contract" checkout --detach c33dc1b5479246d87f24d611a8ad66c30f4310f4
          npm --prefix "$RUNNER_TEMP/widget-contract" ci
          QUANTEM_GPU_SRC="$GITHUB_WORKSPACE/src" PYTHON=python npm --prefix "$RUNNER_TEMP/widget-contract" run build
          python -m pip install "$RUNNER_TEMP/widget-contract"
      # sources.json lists every file quantem.widget bundles; the entry point alone never reached direct_ptycho/webgpu.
      # npm run typecheck uses the widget's compiler options, so an unused parameter fails here, not in the widget.
      - name: Type-check the bundled browser sources
        run: npm run typecheck
      - name: Run Python tests
        run: PYTHONPATH=src pytest -q -m "" --durations=20

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[docs]" pytest
      - name: Build and verify documentation
        run: |
          python scripts/check_docs_links.py
          python -m pytest -q tests/infrastructure/test_docs_site.py
          jupyter-book build docs
          python scripts/check_docs_links.py --html-root docs/_build/html
          python scripts/check_docs_nav_toggle.py docs/_build/html

  metal:
    name: Metal package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Check Swift formatting
        run: >-
          xcrun swift-format lint --strict --recursive
          Package.swift
          native/swift/Sources
          native/swift/Tests
          native/swift/Benchmarks
      - name: Run Swift tests with two workers
        run: /usr/bin/time -p swift test -c release --parallel --num-workers 2 --xunit-output "$RUNNER_TEMP/metal-workers-2.xml"
      - name: Measure Swift tests with three workers
        run: /usr/bin/time -p swift test -c release --skip-build --parallel --num-workers 3 --xunit-output "$RUNNER_TEMP/metal-workers-3.xml"
      - name: Verify matched test coverage
        run: |
          python3 - <<'PYTEST'
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          runs = []
          for count in (2, 3):
              tree = ET.parse(root / f"metal-workers-{count}.xml")
              cases = tree.findall(".//testcase")
              assert cases, "Swift test report must not be empty"
              assert not tree.findall(".//failure") and not tree.findall(".//error")
              runs.append({(case.get("classname"), case.get("name")) for case in cases})
          assert runs[0] == runs[1], "Worker comparison changed test coverage"
          print(f"Both runs executed the same {len(runs[0])} test cases")
          PYTEST
      - name: Exact paired-ANS mean diffraction
        run: bash scripts/check_paired_mean_diffraction.sh --skip-build
      - name: Shared display consumer and parity
        run: bash scripts/check_metal_display.sh --skip-build

  metal-platforms:
    name: Native consumers and iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Check native EMPAD source contract
        run: |
          swift build -c release --package-path tests/hardware/metal/swift_original_packing --product EMPADSourceParity
          export EMPAD_SOURCE_PARITY_EXE="$PWD/tests/hardware/metal/swift_original_packing/.build/release/EMPADSourceParity"
          python3 tests/hardware/metal/test_empad_source.py -v EMPADSourceTests.test_rectangular_raw_preserves_measurements_and_selection EMPADSourceTests.test_xml_acquisition_matches_raw_frame_bits EMPADSourceTests.test_xml_conflicts_and_unsafe_entities_are_rejected EMPADSourceTests.test_incomplete_and_ambiguous_acquisitions_do_not_open EMPADSourceTests.test_source_changes_with_restored_mtime_are_rejected
      - name: Compile Metal for iOS
        run: |
          xcrun -sdk iphoneos metal -c native/swift/Sources/Metal4DSTEMKernels/Resources/detector.metal -o /tmp/quantem-detector.air
          xcrun -sdk iphoneos metal -c src/quantem/gpu/io/hdf5/mps/kernels/qh5idx.metal -o /tmp/quantem-qh5idx.air
          xcrun -sdk iphoneos metal -c native/swift/Sources/Metal4DSTEMKernels/Resources/empad_float.metal -o /tmp/quantem-empad.air
          xcrun -sdk iphoneos metal -c src/quantem/gpu/display/metal/display.metal -o /tmp/quantem-display.air
      - name: Build Swift libraries for iOS
        run: |
          xcodebuild -scheme Metal4DSTEMKernels -destination generic/platform=iOS -configuration Release CODE_SIGNING_ALLOWED=NO build
          xcodebuild -scheme MetalDisplayKernels -destination generic/platform=iOS -configuration Release CODE_SIGNING_ALLOWED=NO build
