name: Tests

on:
  pull_request:
  push:
    branches: [main]
  # Every job runs in full once a week, whatever changed.
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each job below runs only when the files it tests changed. A change to this
  # workflow, a scheduled or manual run, or a diff that cannot be computed runs
  # every job.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.areas.outputs.native }}
      qem: ${{ steps.areas.outputs.qem }}
      python: ${{ steps.areas.outputs.python }}
      docs: ${{ steps.areas.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci_changed_areas.sh

  qem-portable:
    name: QEM reference and integrity (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.qem == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux runs these files in the Python job.
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU tensor runtime
        if: runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_qem_validation.py tests/test_qem_metadata.py tests/test_qem_reference.py

  python:
    name: Python 3.11
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,movie,plot]" ipython "pytest-xdist==3.8.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser contract tools
        run: npm ci
      - name: Build pinned widget for display contract tests
        run: |
          git clone --no-checkout https://github.com/bobleesj/quantem.widget.git "$RUNNER_TEMP/widget-contract"
          git -C "$RUNNER_TEMP/widget-contract" checkout --detach 87be0f65b5d937ba83b7842615ce07ee004687f7
          npm --prefix "$RUNNER_TEMP/widget-contract" ci
          QUANTEM_GPU_SRC="$GITHUB_WORKSPACE/src" PYTHON=python npm --prefix "$RUNNER_TEMP/widget-contract" run build
          python -m pip install "$RUNNER_TEMP/widget-contract"
      # sources.json lists every file quantem.widget bundles; the entry point alone never reached direct_ptycho/webgpu.
      # npm run typecheck uses the widget's compiler options, so an unused parameter fails here, not in the widget.
      - name: Type-check the bundled browser sources
        run: npm run typecheck
      - name: Run Python tests
        run: PYTHONPATH=src pytest -q -m "" -n 4 --dist worksteal --durations=20

  # The GPU docs workflow builds the pages on main, so this job checks pull requests.
  docs:
    name: Documentation
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[docs]" pytest
      - name: Build and verify documentation
        run: |
          python scripts/check_docs_links.py
          python -m pytest -q tests/infrastructure/test_docs_site.py
          jupyter-book build docs
          python scripts/check_docs_links.py --html-root docs/_build/html
          python scripts/check_docs_nav_toggle.py docs/_build/html

  metal:
    name: Metal package
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Give unchanged sources their commit times
        run: bash scripts/ci_restore_mtimes.sh
      # SwiftPM rebuilds only the targets whose sources changed since the cached build.
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-metal-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved', 'native/**', 'src/quantem/gpu/**/*.metal', 'src/quantem/gpu/**/*.msl', 'src/quantem/gpu/display/colormaps.json') }}
          restore-keys: swiftpm-metal-${{ runner.os }}-
      - name: Check Swift formatting
        run: >-
          xcrun swift-format lint --strict --recursive
          Package.swift
          native/swift/Sources
          native/swift/Tests
          native/swift/Benchmarks
      - name: Run Swift tests
        # Keep the complete suite and original tolerances on three bounded workers.
        run: swift test -c release --parallel --num-workers 3
      - name: Exact paired-ANS mean diffraction
        run: bash scripts/check_paired_mean_diffraction.sh --skip-build
      - name: Shared display consumer and parity
        run: bash scripts/check_metal_display.sh --skip-build

  metal-platforms:
    name: Native consumers and iOS
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Give unchanged sources their commit times
        run: bash scripts/ci_restore_mtimes.sh
      - uses: actions/cache@v4
        with:
          path: |
            tests/hardware/metal/swift_original_packing/.build
            .build
          key: swiftpm-platforms-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved', 'native/**', 'tests/hardware/metal/swift_original_packing/**', 'src/quantem/gpu/**/*.metal', 'src/quantem/gpu/**/*.msl') }}
          restore-keys: swiftpm-platforms-${{ runner.os }}-
      - name: Check native EMPAD source contract
        run: |
          swift build -c release --package-path tests/hardware/metal/swift_original_packing --product EMPADSourceParity
          export EMPAD_SOURCE_PARITY_EXE="$PWD/tests/hardware/metal/swift_original_packing/.build/release/EMPADSourceParity"
          python3 tests/hardware/metal/test_empad_source.py -v EMPADSourceTests.test_rectangular_raw_preserves_measurements_and_selection EMPADSourceTests.test_xml_acquisition_matches_raw_frame_bits EMPADSourceTests.test_xml_conflicts_and_unsafe_entities_are_rejected EMPADSourceTests.test_incomplete_and_ambiguous_acquisitions_do_not_open EMPADSourceTests.test_source_changes_with_restored_mtime_are_rejected
      - name: Compile Metal for iOS
        run: |
          xcrun -sdk iphoneos metal -c native/swift/Sources/Metal4DSTEMKernels/Resources/detector.metal -o /tmp/quantem-detector.air
          xcrun -sdk iphoneos metal -c src/quantem/gpu/io/hdf5/mps/kernels/qh5idx.metal -o /tmp/quantem-qh5idx.air
          xcrun -sdk iphoneos metal -c native/swift/Sources/Metal4DSTEMKernels/Resources/empad_float.metal -o /tmp/quantem-empad.air
          xcrun -sdk iphoneos metal -c src/quantem/gpu/display/metal/display.metal -o /tmp/quantem-display.air
      - name: Build Swift libraries for iOS
        run: |
          xcodebuild -scheme Metal4DSTEMKernels -destination generic/platform=iOS -configuration Release CODE_SIGNING_ALLOWED=NO build
          xcodebuild -scheme MetalDisplayKernels -destination generic/platform=iOS -configuration Release CODE_SIGNING_ALLOWED=NO build
