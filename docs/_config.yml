      performance/2026-10-23-qem-compression: io/reports/2026-10-23-qem-compression.html
      performance/2026-10-23-qem-layout-cuda-profile: io/reports/2026-10-23-qem-layout-cuda-profile.html
      performance/2026-10-23-qem-verification: io/reports/2026-10-23-qem-verification.html
      performance/2026-10-24-direct-c10-cache-transfer: rendering/reports/2026-10-24-direct-c10-cache-transfer.html
      performance/cuda-count-codecs: io/codecs.html
      performance/parity: parity/index.html
      performance/direct-joint-fit: direct/joint-fit.html
    html_theme_options:
      secondary_sidebar_items: []
      show_navbar_depth: 1
    html_static_path:
      - "_static"
    html_css_files:
      - custom.css
    html_js_files:
      - nav-toggle-fix.js
      - benchmark-tables.js
    suppress_warnings:
      - "etoc.toctree"
    copyright: "2026, ophusgroup"

html:
  use_issues_button: false
  use_repository_button: true
  home_page_in_navbar: false

repository:
  url: https://github.com/bobleesj/quantem.gpu
  path_to_book: docs
  branch: main
