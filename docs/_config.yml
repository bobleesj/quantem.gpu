# Jupyter Book config for the quantem.gpu documentation site. Builds are
# hardware-independent: measured numbers are written into the pages as dated
# records rather than produced by rerunning private data on Pages CI.
title: quantem.gpu
author: Sangjoon Lee et al.
logo: ""
only_build_toc_files: true
exclude_patterns:
  - "**/._*"

execute:
  execute_notebooks: "off"

sphinx:
  config:
    # This site is static and does not expose an in-page notebook kernel.
    # Listing the extensions explicitly omits sphinx-thebe and avoids loading
    # its runtime on every page while retaining MyST/MathJax rendering.
    extensions:
      - sphinx_togglebutton
      - sphinx_copybutton
      - myst_nb
      - jupyter_book
      - sphinx_comments
      - sphinx_external_toc
      - sphinx.ext.intersphinx
      - sphinx_design
      - sphinx_book_theme
      - sphinx_reredirects
    redirects:
      maintainer/2026-09-11-direct-performance-checkpoints: ../performance/direct/reports/2026-09-11-direct-performance-checkpoints.html
      maintainer/2026-10-15-cuda-batched-refinement: ../performance/direct/reports/2026-10-15-cuda-batched-refinement.html
      maintainer/2026-10-15-mps-direct-upsampling: ../performance/direct/reports/2026-10-15-mps-direct-upsampling.html
      maintainer/2026-10-16-direct-coherent-reconstruction: ../performance/direct/reports/2026-10-16-direct-coherent-reconstruction.html
      maintainer/2026-10-17-mps-coherent-reduction: ../performance/direct/reports/2026-10-17-mps-coherent-reduction.html
      maintainer/2026-10-17-mps-interruptible-preview: ../performance/direct/reports/2026-10-17-mps-interruptible-preview.html
      maintainer/2026-10-17-mps-direct-coherent-support: ../performance/direct/reports/2026-10-17-mps-direct-coherent-support.html
      maintainer/2026-10-17-mps-direct-dispatch: ../performance/direct/reports/2026-10-17-mps-direct-dispatch.html
      maintainer/2026-10-17-mps-direct-group-fusion: ../performance/direct/reports/2026-10-17-mps-direct-group-fusion.html
      maintainer/2026-10-17-mps-direct-loading: ../performance/direct/reports/2026-10-17-mps-direct-loading.html
      maintainer/2026-10-17-direct-aperture-bounds: ../performance/direct/reports/2026-10-17-direct-aperture-bounds.html
      maintainer/2026-10-18-cuda-direct-group-support: ../performance/direct/reports/2026-10-18-cuda-direct-group-support.html
      maintainer/2026-10-18-mps-direct-source-addressing: ../performance/direct/reports/2026-10-18-mps-direct-source-addressing.html
      maintainer/2026-10-20-mps-memory: ../performance/direct/reports/2026-10-20-mps-memory.html
      maintainer/2026-10-20-mps-performance: ../performance/direct/reports/2026-10-20-mps-performance.html
      maintainer/2026-10-20-mps-direct-separable-coherent: ../performance/direct/reports/2026-10-20-mps-direct-separable-coherent.html
      maintainer/2026-10-20-mps-tilt-speed: ../performance/direct/reports/2026-10-20-mps-tilt-speed.html
      maintainer/2026-10-20-direct-cuda-standard-fit: ../performance/direct/reports/2026-10-20-direct-cuda-standard-fit.html
      maintainer/2026-10-20-direct-cuda-tilt-speed: ../performance/direct/reports/2026-10-20-direct-cuda-tilt-speed.html
