[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantem.gpu"
version = "0.0.1rc6"
description = "Multi-backend accelerated STEM load, decompression, and compute for QuantEM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [
    {name = "Sangjoon Bob Lee"}
]
keywords = [
    "4dstem",
    "cuda",
    "electron-microscopy",
    "gpu",
    "mps",
    "stem",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "h5py",
    "hdf5plugin",
    "jinja2",
    "numba>=0.60",
    "numpy>=2.0.0",
    "optuna",
    "pandas",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
cuda = [
    "cuda-python",
    "cupy-cuda12x[ctk]>=12.0",
]
remote = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
movie = [
    "imageio-ffmpeg",
    "pillow",
]
mps = [
    "mlx",
    "pyobjc-framework-Metal; platform_system == 'Darwin'",
]
dev = [
    "fastapi>=0.115",
    "httpx2",
    "pytest>=8",
    "torch",
    "uvicorn>=0.30",
]
docs = [
    "jupyter-book>=1.0",
    "sphinx>=7",
    "myst-nb>=1.1",
]

[project.scripts]
quantem-gpu = "quantem.gpu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantem"]
exclude = [
    "src/quantem/gpu/swift/Benchmarks",
    "src/quantem/gpu/swift/Tests",
]
artifacts = [
    "src/quantem/gpu/io/backends/mps/kernels/*.msl",
    "src/quantem/gpu/io/backends/webgpu/*.ts",
    "src/quantem/gpu/display/webgpu/*.ts",
    "src/quantem/gpu/display/goldens/*.json",
    "src/quantem/gpu/detector/compute/mps/metal/*.msl",
    "src/quantem/gpu/device/*.ts",
    "src/quantem/gpu/detector/*.ts",
    "src/quantem/gpu/detector/compute/webgpu/*.ts",
    "src/quantem/gpu/dpc/compute/webgpu/*.ts",
    "src/quantem/gpu/ssb/compute/webgpu/*.ts",
    "src/quantem/gpu/ssb/compute/webgpu/kernels/*.ts",
    "src/quantem/gpu/swift/Sources/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "docs",
    "src/quantem/gpu",
    "tests",
    "Package.swift",
    "README.md",
    "environment-remote-cuda.yml",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
